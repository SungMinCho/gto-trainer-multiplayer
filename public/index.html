<style>
img{max-width:100%}[hidden]{display:none!important}
/* Layout: one oval felt table, hero anchored bottom-center; desktop puts the study rail (live numbers, log, review) to the right, phones stack it under the table. */
:root {
  --bg: #0b0f15;
  --bg-2: #10161e;
  --panel: #141b24;
  --panel-2: #1a2330;
  --line: #243041;
  --line-2: #2e3d52;
  --text: #e7ecf3;
  --muted: #8d9aae;
  --faint: #5d6a7e;
  --felt: #17362f;
  --felt-hi: #1f4a40;
  --felt-edge: #0c211c;
  --rail: #070a0e;
  --accent: #3fd0b6;
  --accent-ink: #062520;
  --chip: #e9b95c;
  --fold: #4f86e8;
  --call: #3cb27a;
  --raise: #e2564d;
  --allin: #b03a6a;
  --card: #f3f4f7;
  --card-edge: #c9ced8;
  --s-s: #1b2130;
  --s-h: #d23c35;
  --s-d: #2c6ad1;
  --s-c: #2a9256;
  --g-brilliant: #1bb3a8;
  --g-great: #5b8db6;
  --g-book: #a88864;
  --g-good: #8fb54a;
  --g-inacc: #e8b84a;
  --g-mistake: #e2862a;
  --g-blunder: #cf3b36;
  --f-ui: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-num: 'Barlow Semi Condensed', 'IBM Plex Sans KR', system-ui, sans-serif;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- lobby ---------- */
.lobby { max-width: 920px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 16px calc(64px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 28px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--felt); border: 2px solid var(--felt-hi); display: grid; place-items: center; font: 700 18px/1 var(--f-num); color: var(--chip); letter-spacing: .02em; }
.brand h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.lobby-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
@media (max-width: 760px) { .lobby-grid { grid-template-columns: 1fr; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.box h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; color: var(--muted); }
.input { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; color: var(--text); font: inherit; width: 100%; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 10px 14px; font-weight: 600; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tables { display: grid; gap: 8px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); }
.trow .meta { color: var(--muted); font-size: 12px; }
.empty { color: var(--faint); font-size: 13px; padding: 8px 2px; }
.feature-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.feature-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; color: var(--muted); font-size: 13px; }
.feature-list b { color: var(--text); font-weight: 600; display: block; }
.notice { border: 1px solid #5a4a22; background: #221d10; color: #e9d7a8; border-radius: 10px; padding: 10px 12px; font-size: 13px; }

/* ---------- table screen ---------- */
/* the table screen is always exactly the window: the table scales into the space the top bar and action bar leave */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; position: relative; z-index: 36; }
.tb-n, .mn-n { display: none; }
@media (max-width: 760px), (max-height: 560px) {
  .topbar { gap: 6px; padding: 7px 10px; }
  .topbar .tb-w { display: none; }
  .topbar .tb-n { display: inline; }
  .topbar .code { padding: 5px 7px; letter-spacing: .04em; }
  .topbar .btn.sm { padding-left: 9px; padding-right: 9px; }
  .menu .mn-n { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
}
.topbar .code { font: 600 13px/1 var(--f-num); letter-spacing: .08em; padding: 6px 9px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line-2); }
.topbar .sp { flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--call); display: inline-block; }
.dot.off { background: var(--raise); }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); min-height: 0; }
.stage { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 10px 16px 0; }
.tarea { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; }
#bar { flex: none; min-width: 0; }
.rail { border-left: 1px solid var(--line); background: var(--bg-2); overflow: auto; min-height: 0; display: grid; align-content: start; overscroll-behavior: contain; }
.rail-top, .scrim { display: none; }
/* narrower windows: the rail becomes a drawer, opened from the numbers line above the action buttons */
@media (max-width: 1060px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 38; border-left: 1px solid var(--line-2); box-shadow: -20px 0 50px rgba(0, 0, 0, .5); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); transform: translateX(105%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
  .rail.open { transform: none; visibility: visible; transition: transform .22s ease; }
  .rail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-2); z-index: 1; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(3, 6, 10, .55); z-index: 37; }
}

/* the table is laid out at a fixed design size (wide oval, or tall oval when the space is portrait) and scaled to fit by fitTable() */
.table-wrap { position: absolute; left: 50%; top: 50%; width: 980px; height: 549px; transform: translate(-50%, -50%); transform-origin: 50% 50%; --cw: 46px; --ch: 64px; }
.table-wrap.port { width: 360px; height: 468px; --cw: 34px; --ch: 48px; }
.felt { position: absolute; inset: 9% 7%; border-radius: 999px; background: radial-gradient(ellipse at 50% 40%, var(--felt-hi), var(--felt) 60%, var(--felt-edge)); box-shadow: 0 0 0 10px var(--rail), 0 0 0 11px #1c2633, 0 30px 60px -20px #000; }
.port .felt { inset: 11% 9%; border-radius: 46%; }
.port .felt-label { display: none; }
.felt-label { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); color: rgba(255, 255, 255, .07); font: 700 13px/1 var(--f-num); letter-spacing: .4em; white-space: nowrap; }
.center { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(var(--sb, 1)); display: grid; justify-items: center; gap: 10px; width: 70%; }
.board { display: flex; gap: 6px; min-height: var(--ch); }
.pot { font: 600 15px/1 var(--f-num); color: var(--text); background: rgba(0, 0, 0, .32); padding: 6px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
.pot .lbl { color: var(--muted); font: 500 11px/1 var(--f-ui); }
.phase-msg { font-size: 12px; color: var(--muted); background: rgba(0, 0, 0, .3); padding: 5px 10px; border-radius: 999px; }

/* cards */
.wrap { --cw: 46px; --ch: 64px; }
@media (max-width: 640px) { .wrap { --cw: 34px; --ch: 48px; } }
.card { width: var(--cw); height: var(--ch); border-radius: 6px; background: var(--card); border: 1px solid var(--card-edge); position: relative; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(0, 0, 0, .35); flex: none; }
.card .r { font: 700 calc(var(--ch) * .44)/1 var(--f-num); letter-spacing: -.02em; }
.card .s { position: absolute; right: 4px; bottom: 2px; font-size: calc(var(--ch) * .27); line-height: 1; }
.card .s2 { position: absolute; left: 4px; top: 3px; font-size: calc(var(--ch) * .2); line-height: 1; }
.card.sm { --cw: 30px; --ch: 42px; }
.card.xs { --cw: 22px; --ch: 30px; border-radius: 4px; }
.card.suit-s { color: var(--s-s); } .card.suit-h { color: var(--s-h); } .card.suit-d { color: var(--s-d); } .card.suit-c { color: var(--s-c); }
.card.back { background: repeating-linear-gradient(45deg, #24364a 0 4px, #1c2b3c 4px 8px); border-color: #3a5068; }
.card.ghost { background: transparent; border: 1px dashed rgba(255, 255, 255, .12); box-shadow: none; }
.card.deal { animation: deal .32s ease-out both; }
@keyframes deal { from { transform: translateY(-14px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.card.dim { filter: brightness(.55) saturate(.6); }

/* seats */
.seat { position: absolute; width: 132px; transform: translate(-50%, -50%) scale(var(--sb, 1)); display: grid; justify-items: center; gap: 4px; z-index: 2; }
.port .seat { width: 92px; }
.seat .holes { display: flex; gap: 3px; height: var(--ch); margin-bottom: -18px; position: relative; z-index: 1; }
.seat .plate { position: relative; z-index: 2; width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px 8px 7px; display: grid; gap: 1px; justify-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.seat.me .plate { border-color: #3c5674; }
.seat.acting .plate { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(63, 208, 182, .25), 0 6px 16px rgba(0, 0, 0, .35); }
.seat.folded .plate, .seat.folded .holes { opacity: .45; }
.seat.away .plate { opacity: .6; }
.seat .nm { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .stk { font: 600 15px/1.1 var(--f-num); }
.seat .pl { font: 500 11px/1 var(--f-num); color: var(--muted); }
.seat .pl.up { color: var(--call); } .seat .pl.down { color: var(--raise); }
.pos { position: absolute; top: -9px; left: 8px; font: 700 10px/1 var(--f-num); letter-spacing: .04em; padding: 3px 5px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); }
.pos.btn { background: #f1f2f4; color: #10161e; border-color: #f1f2f4; }
.tag { position: absolute; top: -9px; right: 8px; font: 600 10px/1 var(--f-ui); padding: 3px 5px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); }
.lastact { font: 600 11px/1 var(--f-ui); padding: 3px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.lastact.f { color: #9fbcf3; } .lastact.c, .lastact.x { color: #8fd8b2; } .lastact.r { color: #f2a19b; }
.timer { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.timer.low i { background: var(--raise); }
.bet { position: absolute; transform: translate(-50%, -50%) scale(var(--sb, 1)); z-index: 1; display: inline-flex; align-items: center; gap: 5px; font: 600 13px/1 var(--f-num); background: rgba(0, 0, 0, .35); padding: 4px 8px 4px 4px; border-radius: 999px; transition: left .25s, top .25s; white-space: nowrap; }
.chipdot { width: 14px; height: 14px; border-radius: 50%; background: var(--chip); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .18), inset 0 0 0 5px #f7dca0; }
.empty-seat { position: absolute; transform: translate(-50%, -50%) scale(var(--sb, 1)); display: grid; gap: 6px; justify-items: center; z-index: 2; }
.empty-seat .btn { background: rgba(10, 14, 19, .7); border-style: dashed; }
.gbadge { position: absolute; top: -12px; right: -10px; z-index: 5; }
.kick { padding: 0 5px; font-size: 11px; line-height: 16px; border-radius: 5px; }
@media (hover: hover) { .seat .kick { opacity: 0; } .seat:hover .kick, .seat:focus-within .kick { opacity: 1; } }
.port .seat .kick { display: none; } .port .seat .holes { margin-bottom: -8px; } .port .center { top: 50%; width: 80%; }

/* grade icons (chess.com-style) */
.gi { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 800 12px/1 var(--f-num); color: #fff; flex: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); letter-spacing: -.04em; }
.gi.sm { width: 18px; height: 18px; font-size: 10px; }
.gi.lg { width: 34px; height: 34px; font-size: 16px; }
.gi.brilliant { background: var(--g-brilliant); } .gi.great { background: var(--g-great); } .gi.book { background: var(--g-book); }
.gi.good { background: var(--g-good); } .gi.inacc { background: var(--g-inacc); color: #2b2008; } .gi.mistake { background: var(--g-mistake); } .gi.blunder { background: var(--g-blunder); }
.gi.none { background: var(--panel-2); color: var(--faint); box-shadow: none; }
.gi svg { width: 62%; height: 62%; fill: currentColor; }
.pop { animation: pop .38s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

/* action bar */
.actionbar { max-width: 980px; width: 100%; margin: 0 auto; padding: 8px 0 12px; display: grid; gap: 8px; }
.ab-main { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; }
.abtn { border: 0; border-radius: 10px; padding: 11px 10px; font-weight: 700; font-size: 15px; color: #fff; display: grid; gap: 2px; justify-items: center; }
.abtn small { font: 500 12px/1 var(--f-num); opacity: .85; }
.abtn.f { background: var(--fold); } .abtn.c { background: var(--call); } .abtn.r { background: var(--raise); }
.abtn:hover { filter: brightness(1.08); }
.abtn:disabled { filter: grayscale(.6) brightness(.6); cursor: default; }
.sizer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets .btn { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.sizer input[type=range] { width: 100%; accent-color: var(--raise); }
.amt { width: 92px; text-align: right; font-family: var(--f-num); }
.be { font-size: 11px; color: var(--muted); }
.waitbar { max-width: 980px; margin: 0 auto; padding: 10px 0 14px; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
/* numbers line: the rail's key numbers above the buttons when the rail is a drawer */
.hudline { display: none; }
@media (max-width: 1060px) {
  .hudline { display: flex; width: 100%; max-width: 980px; margin: 8px auto 0; gap: 12px; align-items: center; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); font-size: 12px; color: var(--muted); text-align: left; white-space: nowrap; overflow: hidden; }
  .hudline b { color: var(--text); font: 600 13px/1 var(--f-num); margin-left: 3px; }
  .hudline .more { margin-left: auto; color: var(--accent); }
}
@media (max-width: 400px) { .hudline { gap: 9px; padding: 6px 8px; } .hudline .hl-x { display: none; } }
@media (max-width: 640px) {
  .sizer { grid-template-columns: minmax(0, 1fr) 76px; grid-template-areas: "p a" "s s"; gap: 6px 8px; }
  .presets { grid-area: p; gap: 5px; } .presets .btn { padding: 5px 7px; }
  .sizer input[type=range] { grid-area: s; }
  .amt { grid-area: a; width: 100%; }
  .abtn { padding: 10px 6px; font-size: 14px; }
  .actionbar { gap: 7px; padding: 7px 0 10px; }
}
/* short, wide windows (phone landscape): action panel to the right of the table */
@media (max-height: 560px) and (min-aspect-ratio: 4/3) {
  .stage { flex-direction: row; gap: 12px; padding: 6px 10px; }
  #bar { width: 280px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
  .hudline .hl-x { display: none; }
  .actionbar { padding: 0; gap: 7px; }
  .sizer { grid-template-columns: minmax(0, 1fr) 76px; grid-template-areas: "p p" "s a"; gap: 6px 8px; }
  .presets { grid-area: p; gap: 5px; } .presets .btn { padding: 4px 7px; }
  .sizer input[type=range] { grid-area: s; }
  .amt { grid-area: a; width: 100%; }
  .abtn { padding: 9px 6px; font-size: 14px; }
  .waitbar { padding: 0; }
  .hudline { margin: 0 0 8px; }
}

/* rail sections */
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; }
.kv .k { color: var(--muted); }
.kv .v { font: 600 15px/1.25 var(--f-num); text-align: right; }
.kv .v small { font: 500 11px/1 var(--f-ui); color: var(--muted); margin-left: 4px; }
.eqbar { position: relative; height: 10px; border-radius: 6px; background: var(--panel-2); overflow: visible; margin: 8px 0 4px; }
.eqbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--accent); }
.eqbar .need { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; border-radius: 2px; }
.eqcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.verdict { margin-top: 8px; font-size: 12px; padding: 7px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.verdict b { color: var(--text); }
.handname { font-size: 15px; font-weight: 600; }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); }
.log { display: grid; gap: 6px; font-size: 12px; }
.log .st { color: var(--faint); font-size: 11px; letter-spacing: .06em; margin-top: 4px; display: flex; gap: 6px; align-items: center; }

<div id="root"></div>
<script>
var H = window.H = {}; H.PLATFORM = 'web';
/* ---- core.js ---- */
// ===== core: cards, combos, classes, evaluator, ranges, rng =====

(typeof globalThis !== 'undefined' ? globalThis : window).H = H;

(function (H) {
  'use strict';
  var RANKS = '23456789TJQKA';
  var SUITS = 'cdhs';
  H.RANKS = RANKS; H.SUITS = SUITS;

  // card c in 0..51: rank = c>>2 (0='2'..12='A'), suit = c&3
  H.card = function (str) { return RANKS.indexOf(str[0].toUpperCase()) * 4 + SUITS.indexOf(str[1].toLowerCase()); };
  H.cardStr = function (c) { return RANKS[c >> 2] + SUITS[c & 3]; };
  H.cardsStr = function (a) { return a.map(H.cardStr).join(' '); };

  // ---- combos (1326) ----
  var COMBO_A = new Int8Array(1326), COMBO_B = new Int8Array(1326);
  var COMBO_IDX = new Int16Array(52 * 52).fill(-1);
  (function () {
    var k = 0;
    for (var a = 0; a < 52; a++) for (var b = a + 1; b < 52; b++) {
      COMBO_A[k] = b; COMBO_B[k] = a; // A = higher card index
      COMBO_IDX[a * 52 + b] = k; COMBO_IDX[b * 52 + a] = k; k++;
    }
  })();
  H.COMBO_A = COMBO_A; H.COMBO_B = COMBO_B;
  H.comboIdx = function (a, b) { return COMBO_IDX[a * 52 + b]; };
  // combos containing each card
  H.CARD_COMBOS = [];
  for (var c0 = 0; c0 < 52; c0++) H.CARD_COMBOS.push([]);
  for (var k0 = 0; k0 < 1326; k0++) { H.CARD_COMBOS[COMBO_A[k0]].push(k0); H.CARD_COMBOS[COMBO_B[k0]].push(k0); }

  // ---- classes (169) ----
  // grid: row/col index R = 12 - rank (A=0). pair on diagonal, suited upper-right (row<col), offsuit lower-left.
  var COMBO_CLASS = new Int16Array(1326);
  var CLASS_COMBOS = [];
  for (var i = 0; i < 169; i++) CLASS_COMBOS.push([]);
  function classOf(a, b) {
    var ra = a >> 2, rb = b >> 2;
    if (ra < rb) { var t = ra; ra = rb; rb = t; }
    var Ra = 12 - ra, Rb = 12 - rb;
    if (ra === rb) return Ra * 13 + Ra;
    if ((a & 3) === (b & 3)) return Ra * 13 + Rb; // suited: row high, col low (Ra<Rb)
    return Rb * 13 + Ra; // offsuit
  }
  H.classOf = classOf;
  for (var k1 = 0; k1 < 1326; k1++) { var cl = classOf(COMBO_A[k1], COMBO_B[k1]); COMBO_CLASS[k1] = cl; CLASS_COMBOS[cl].push(k1); }
  H.COMBO_CLASS = COMBO_CLASS; H.CLASS_COMBOS = CLASS_COMBOS;
  H.className = function (cl) {
    var r = (cl / 13) | 0, c = cl % 13;
    if (r === c) return RANKS[12 - r] + RANKS[12 - r];
    if (r < c) return RANKS[12 - r] + RANKS[12 - c] + 's';
    return RANKS[12 - c] + RANKS[12 - r] + 'o';
  };
  H.CLASS_NAMES = []; for (var q = 0; q < 169; q++) H.CLASS_NAMES.push(H.className(q));
  H.classIndex = function (name) { return H.CLASS_NAMES.indexOf(name); };
  H.classCount = function (cl) { return CLASS_COMBOS[cl].length; };
  H.classIsPair = function (cl) { return ((cl / 13) | 0) === cl % 13; };
  H.classIsSuited = function (cl) { var r = (cl / 13) | 0, c = cl % 13; return r < c; };
  // ranks (0..12, 12=A) of class: [hi, lo]
  H.classRanks = function (cl) {
    var r = (cl / 13) | 0, c = cl % 13;
    if (r <= c) return [12 - r, 12 - c];
    return [12 - c, 12 - r];
  };

  // ---- evaluator ----
  var HIGHBIT = new Int8Array(8192), POP = new Int8Array(8192), STRAIGHT = new Int8Array(8192);
  for (var m = 1; m < 8192; m++) {
    var h = 12; while (!(m & (1 << h))) h--; HIGHBIT[m] = h;
    POP[m] = POP[m & (m - 1)] + 1;
  }
  for (var m2 = 0; m2 < 8192; m2++) {
    STRAIGHT[m2] = -1;
    for (var top = 12; top >= 4; top--) {
      var need = 31 << (top - 4);
      if ((m2 & need) === need) { STRAIGHT[m2] = top; break; }
    }
    if (STRAIGHT[m2] < 0) { var wheel = (1 << 12) | 15; if ((m2 & wheel) === wheel) STRAIGHT[m2] = 3; }
  }
  function topN(mask, n) { // pack top n ranks into 4-bit nibbles
    var v = 0;
    for (var i = 0; i < n; i++) {
      if (!mask) { v <<= 4; continue; }
      var hb = HIGHBIT[mask]; v = (v << 4) | hb; mask &= ~(1 << hb);
    }
    return v;
  }
  // categories: 0 high,1 pair,2 two pair,3 trips,4 straight,5 flush,6 full house,7 quads,8 straight flush
  var CAT_SHIFT = 1 << 20;
  // evaluate an array of cards (5..7) given as list; returns int, higher better
  function evalCards(cards, n) {
    if (n === undefined) n = cards.length;
    var s1 = 0, s2 = 0, s3 = 0, s4 = 0, sm0 = 0, sm1 = 0, sm2 = 0, sm3 = 0;
    for (var i = 0; i < n; i++) {
      var c = cards[i], b = 1 << (c >> 2);
      if (s3 & b) s4 |= b; else if (s2 & b) s3 |= b; else if (s1 & b) s2 |= b; else s1 |= b;
      switch (c & 3) { case 0: sm0 |= b; break; case 1: sm1 |= b; break; case 2: sm2 |= b; break; default: sm3 |= b; }
    }
    var fm = POP[sm0] >= 5 ? sm0 : POP[sm1] >= 5 ? sm1 : POP[sm2] >= 5 ? sm2 : POP[sm3] >= 5 ? sm3 : 0;
    if (fm) {
      var sf = STRAIGHT[fm];
      if (sf >= 0) return 8 * CAT_SHIFT + sf;
    }
    if (s4) { var qr = HIGHBIT[s4]; return 7 * CAT_SHIFT + (qr << 4) + HIGHBIT[s1 & ~(1 << qr)]; }
    if (s3) {
      var tr = HIGHBIT[s3];
      var rest = s2 & ~(1 << tr);
      if (rest) return 6 * CAT_SHIFT + (tr << 4) + HIGHBIT[rest];
    }
    if (fm) return 5 * CAT_SHIFT + topN(fm, 5);
    var st = STRAIGHT[s1];
    if (st >= 0) return 4 * CAT_SHIFT + st;
    if (s3) { var t2 = HIGHBIT[s3]; return 3 * CAT_SHIFT + (t2 << 8) + topN(s1 & ~(1 << t2), 2); }
    var pairs = s2;
    if (POP[pairs] >= 2) {
      var p1 = HIGHBIT[pairs], p2 = HIGHBIT[pairs & ~(1 << p1)];

// ===== game: deterministic No-Limit Hold'em betting engine (amounts in centi-bb) =====
(function (H) {
  'use strict';
  var POS6 = { 2: ['BTN', 'BB'], 3: ['BTN', 'SB', 'BB'], 4: ['CO', 'BTN', 'SB', 'BB'], 5: ['HJ', 'CO', 'BTN', 'SB', 'BB'], 6: ['LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'] };
  H.POS_ORDER = ['LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB']; // preflop action order (6-max)
  H.POS_KO = { LJ: 'UTG', HJ: 'HJ', CO: 'CO', BTN: 'BTN', SB: 'SB', BB: 'BB' };

  // participants are given in seat order (clockwise). button = index into that list.
  // returns position label per participant
  H.positions = function (n, button) {
    var labels = new Array(n);
    if (n === 2) { labels[button] = 'BTN'; labels[(button + 1) % 2] = 'BB'; return labels; }
    // action order preflop starts left of BB: order list POS6[n] corresponds to seats starting at button+3
    var order = POS6[n];
    for (var k = 0; k < n; k++) labels[(button + 3 + k) % n] = order[k];
    return labels;
  };

  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  H.cloneState = clone;

  // cfg: {n, button, stacks[], sb, bb}
  H.newHand = function (cfg) {
    var n = cfg.n, s = {
      n: n, button: cfg.button, sb: cfg.sb, bb: cfg.bb,

      var o = k.split('-')[0], d = k.split('-')[1];
      var oL = o === 'HU' ? 'BTN(HU)' : posKo(o), dL = posKo(d);
      if (kind === 'A') out.push({ key: k, node: 'A', label: dL + ' vs ' + oL + ' 오픈' });
      if (kind === 'B') out.push({ key: k, node: 'B', label: oL + ' 오픈 → ' + dL + ' 3벳' });
      if (kind === 'C') out.push({ key: k, node: 'C', label: dL + ' 3벳 → ' + oL + ' 4벳' });
      if (kind === 'E') out.push({ key: k, node: 'E', label: oL + ' 4벳 → ' + dL + ' 올인' });
    });
    return out;
  }
  function currentSpotSel() {
    var t = app.table, st = t && t.st, hd = st && st.hand;
    if (!hd || hd.ph !== 'play') return null;
    var es = H.handEngine(hd), i = hd.ids.indexOf(t.myId());
    if (i < 0 || es.street !== 0 || es.folded[i]) return null;
    // spot as if it were my turn now
    var sp = H.preflopSpot(es, i);
    var sel = { spot: sp, cls: t.myHole ? H.classOf(t.myHole[0], t.myHole[1]) : -1 };
    if (sp.key === 'RFI') sel.kind = 'RFI', sel.key = 'RFI', sel.node = sp.node;
    else if (H.CH_META[sp.key]) sel.kind = sp.key === 'SBU' || sp.key === 'HUU' ? 'U' : sp.node, sel.key = sp.key, sel.node = sp.node;
    else sel.kind = 'approx';
    return sel;
  }
  function openChart() {
    var cur = currentSpotSel();
    app.chart = { kind: 'RFI', key: 'RFI', node: 'LJ', sel: -1, mine: -1, approx: null, depth: 100, curEff: null };
    var t = app.table;
    if (t && t.myHole) app.chart.mine = H.classOf(t.myHole[0], t.myHole[1]);
    if (cur) {
      if (cur.kind === 'approx') { app.chart.approx = cur.spot; app.chart.kind = 'approx'; }
      else { app.chart.kind = cur.kind; app.chart.key = cur.key; app.chart.node = cur.node; }
      if (cur.spot && cur.spot.eff) { app.chart.curEff = Math.round(cur.spot.eff); app.chart.depth = app.chart.curEff; }
    } else if (t && t.st && t.st.hand) {
      var hd = t.st.hand, es = H.handEngine(hd), i = hd.ids.indexOf(t.myId());
      if (i >= 0) { var p = es.n === 2 && es.pos[i] === 'BTN' ? 'HU' : es.pos[i]; if (H.RFI[p]) app.chart.node = p; }
    }
    app.chart.sel = app.chart.mine;
    renderChart();
  }
  function closeChart() { app.chart = null; $('#modal').innerHTML = ''; }
  function chartData(c) {
    if (c.kind === 'approx') return { f: c.approx.strat.f, labels: ['폴드', '콜/체크', '레이즈'], title: c.approx.label, sub: '표준 차트가 없는 상황이라 강도 순서로 근사했어요' };
    if (c.kind === 'RFI') {
      var limps = c.node === 'SB' || c.node === 'HU';
      return { f: H.rfiNode(c.node, limps ? c.depth : 0).f, labels: ['폴드', '림프', '레이즈'], title: (c.node === 'HU' ? 'BTN (헤즈업)' : posKo(c.node)) + ' 오픈 레인지', sub: '앞에서 모두 폴드했을 때 · ' + (c.node === 'SB' ? '3bb' : '2.5bb') + ' 오픈 · ' + (limps ? '림프(콜)도 섞어요 · BB의 대응까지 함께 푼 차트' : '레이즈 아니면 폴드') };
    }
    if (c.key === 'SBU' || c.key === 'HUU') {
      var mu = H.CH_META[c.key], who = c.key === 'HUU' ? 'BTN(HU)' : 'SB';
      var U = { L: [['폴드', '체크', '레이즈'], 'BB — ' + who + ' 림프에 대응', '림프 1bb · 레이즈 ' + bb(mu.iso) + 'bb'], I: [['폴드', '콜', '리레이즈'], who + ' — 림프 뒤 BB 레이즈에 대응', '레이즈 ' + bb(mu.iso) + 'bb · 리레이즈 ' + bb(mu.rr) + 'bb'], J: [['폴드', '콜', '올인'], 'BB — ' + who + ' 리레이즈에 대응', '리레이즈 ' + bb(mu.rr) + 'bb'], K: [['폴드', '콜', ''], who + ' — 리레이즈 뒤 BB 올인에 대응', '올인'], S: [['폴드', '림프', '레이즈'], who + ' 오픈 레인지', '오픈 ' + bb(mu.o) + 'bb'] }[c.node];
      var nu = H.chartAt(c.key, c.node, c.depth);
      return { f: nu.f, u: nu.u, labels: U[0], title: U[1], sub: U[2] + ' · 유효 스택 ' + c.depth + 'bb · EQR 근사 모델로 푼 차트 · 빈 칸은 이 상황까지 오지 않는 핸드' };
    }
    var m = H.CH_META[c.key], nd = H.chartAt(c.key, c.node, c.depth), o = c.key.split('-')[0], d = c.key.split('-')[1];
    var oL = o === 'HU' ? 'BTN(HU)' : posKo(o), dL = posKo(d);
    var lab = { A: ['폴드', '콜', '3벳'], B: ['폴드', '콜', '4벳'], C: ['폴드', '콜', '5벳 올인'], E: ['폴드', '콜', ''] }[c.node];
    var title = { A: dL + ' — ' + oL + ' 오픈에 대응', B: oL + ' — ' + dL + ' 3벳에 대응', C: dL + ' — ' + oL + ' 4벳에 대응', E: oL + ' — ' + dL + ' 5벳 올인에 대응' }[c.node];
    var sub = { A: '오픈 ' + bb(m.o) + 'bb · 3벳 ' + bb(m.t) + 'bb', B: '3벳 ' + bb(m.t) + 'bb · 4벳 ' + bb(m.f) + 'bb', C: '4벳 ' + bb(m.f) + 'bb · 5벳은 올인', E: '올인' }[c.node];
    return { f: nd.f, u: c.node === 'A' ? null : nd.u, labels: lab, title: title, sub: sub + ' · 유효 스택 ' + c.depth + 'bb · EQR 근사 모델로 푼 차트' + (c.node === 'A' ? '' : ' · 빈 칸은 이 상황까지 오지 않는 핸드') };
  }
  var COLS = ['var(--fold)', 'var(--call)', 'var(--raise)'];
  function renderChart() {
    var c = app.chart; if (!c) return;
    var d = chartData(c), f = d.f, un = d.u;
    var tot = [0, 0, 0], n = 0;
    for (var cl = 0; cl < 169; cl++) { if (un && un[cl]) continue; var w = H.classCount(cl); n += w; for (var a = 0; a < 3; a++) tot[a] += w * f[cl * 3 + a]; }
    var cells = '';
    for (var cl2 = 0; cl2 < 169; cl2++) {
      var segs = '', out = un && un[cl2];
      if (!out) [2, 1, 0].forEach(function (a) { var x = f[cl2 * 3 + a]; if (x > 0.004) segs += '<div class="seg" style="width:' + (x * 100).toFixed(1) + '%;background:' + COLS[a] + (a === 0 ? ';opacity:.55' : '') + '"></div>'; });
      cells += '<div class="cell' + (out ? ' out' : '') + (cl2 === c.mine ? ' mine' : '') + (cl2 === c.sel && cl2 !== c.mine ? ' sel' : '') + '" data-cl="' + cl2 + '" title="' + H.className(cl2) + '">' + segs + '<span>' + H.className(cl2) + '</span></div>';
    }
    var info = '';
    if (c.sel >= 0) {
      var parts = []; for (var a2 = 2; a2 >= 0; a2--) { if (d.labels[a2] && f[c.sel * 3 + a2] > 0.004) parts.push(d.labels[a2] + ' ' + pct(f[c.sel * 3 + a2])); }
      info = '<div class="cellinfo"><b class="num">' + H.className(c.sel) + '</b>' + (c.sel === c.mine ? ' (내 핸드)' : '') + ' — ' + (un && un[c.sel] ? '이 상황까지 오지 않는 핸드예요' : (parts.join(' · ') || '폴드 100%')) + '</div>';
    }
    var kindSel = '<select id="ck">' + KINDS.map(function (k) { return '<option value="' + k[0] + '"' + (c.kind === k[0] ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('') + (c.kind === 'approx' ? '<option value="approx" selected>현재 상황 (근사)</option>' : '') + '</select>';
    var spotSel = '';
    if (c.kind !== 'approx') {
      var opts = chartOptions(c.kind);
      spotSel = '<select id="cs">' + opts.map(function (o) { var v = o.key + '|' + o.node; return '<option value="' + v + '"' + (c.key + '|' + c.node === v ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
      var depths = [40, 100, 200]; if (c.curEff && depths.indexOf(c.curEff) < 0) depths.push(c.curEff); depths.sort(function (x, y) { return x - y; });
      if (!(c.kind === 'RFI' && c.node !== 'SB' && c.node !== 'HU')) spotSel += '<select id="cd" aria-label="유효 스택">' + depths.map(function (d) { return '<option value="' + d + '"' + (d === c.depth ? ' selected' : '') + '>' + (d === c.curEff ? '지금 ' : '') + d + 'bb</option>'; }).join('') + '</select>';
    }
    var html = '<div class="modal" id="cm" role="dialog" aria-modal="true" aria-label="프리플랍 차트"><div class="sheet">' +
      '<div class="sheet-h"><div><h2>' + esc(d.title) + '</h2><p>' + esc(d.sub) + '</p></div><button class="btn sm" id="cx">닫기</button></div>' +
      '<div class="selects">' + kindSel + spotSel + '</div>' +
      '<div class="grid-wrap"><div class="grid">' + cells + '</div></div>' +
      '<div class="legend">' + [2, 1, 0].filter(function (a) { return d.labels[a] && tot[a] > 0; }).map(function (a) { return '<span><i class="sw" style="background:' + COLS[a] + (a === 0 ? ';opacity:.55' : '') + '"></i>' + d.labels[a] + ' ' + pct(tot[a] / n, 1) + '</span>'; }).join('') + '<span class="hint">칸 색 비율 = 빈도</span></div>' +
      info + '</div></div>';
    $('#modal').innerHTML = html;
    $('#cx').onclick = closeChart;
    $('#cm').onclick = function (e) { if (e.target.id === 'cm') closeChart(); };
    $('#ck').onchange = function (e) { var k = e.target.value; if (k === 'approx') return; c.kind = k; var o = chartOptions(k)[0]; c.key = o.key; c.node = o.node; renderChart(); };
    var cs = $('#cs'); if (cs) cs.onchange = function (e) { var v = e.target.value.split('|'); c.key = v[0]; c.node = v[1]; renderChart(); };
    var cd = $('#cd'); if (cd) cd.onchange = function (e) { c.depth = +e.target.value; renderChart(); };
    document.querySelectorAll('.cell').forEach(function (el) { el.onclick = function () { c.sel = +el.getAttribute('data-cl'); renderChart(); }; });
  }

  // ---------- misc ----------
  var toastT = 0;
  function toast(msg) {
    var el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3200);
  }
  // timer bars + review clock tick
  function tick() {
    document.querySelectorAll('.timer[data-dl]').forEach(function (el) {
      var t = app.table; if (!t) return;
      var left = Math.max(0, +el.getAttribute('data-dl') - t.hostNow()), tot = +el.getAttribute('data-total');
      el.firstChild.style.transform = 'scaleX(' + Math.min(1, left / tot).toFixed(3) + ')';
      el.classList.toggle('low', left < 6000);
    });
    requestAnimationFrame(tick);
  }
  addEventListener('resize', function () { if (app.mode === 'table') { fitTable(); trackTopbar(); scheduleRender(); } });

  H.startApp = function () {
    var go = function (data) { boot(data || {}); requestAnimationFrame(tick); };
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(go);
    else go(window.claude && window.claude.hot && window.claude.hot.data);
  };
})(H);

H.startApp();
</script>
</body>
